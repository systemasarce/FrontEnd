<form class="forma-pago-dialog" [formGroup]="form" (ngSubmit)="guardar()">
  <h2 mat-dialog-title>Modificar Forma de Pago</h2>

  <mat-dialog-content class="forma-pago-dialog__content">
    <p class="forma-pago-dialog__description">
      Actualiza la descripcion o el estado del registro seleccionado.
    </p>

    <label class="forma-pago-dialog__field">
      <span>Descripcion</span>
      <input type="text" formControlName="forPagDes" maxlength="120">
      <small class="forma-pago-dialog__error" *ngIf="form.controls['forPagDes'].touched && (form.controls['forPagDes'].hasError('required') || form.controls['forPagDes'].hasError('whitespace'))">Campo Descripcion obligatorio.</small>
    </label>

    <label class="forma-pago-dialog__field">
      <span>Estado</span>
      <select formControlName="flgEst">
        <option value="A">Activo</option>
        <option value="I">Inactivo</option>
      </select>
    </label>

    <p *ngIf="errorMessage" class="forma-pago-dialog__error">{{ errorMessage }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" (click)="cerrar()" [disabled]="isSaving">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="isSaving">
      {{ isSaving ? 'Guardando...' : 'Guardar cambios' }}
    </button>
  </mat-dialog-actions>
</form>

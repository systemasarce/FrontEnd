<section class="moneda-dialog">
  <div mat-dialog-content class="moneda-dialog__content" [formGroup]="form">
    <p class="moneda-dialog__description">
      Registra una nueva moneda. El estado se asigna como activo por defecto.
    </p>

    <label class="moneda-dialog__field">
      <span>Descripcion</span>
      <input type="text" formControlName="monDes" maxlength="120">
      <small class="moneda-dialog__error" *ngIf="form.controls['monDes'].touched && (form.controls['monDes'].hasError('required') || form.controls['monDes'].hasError('whitespace'))">Campo Descripcion obligatorio.</small>
    </label>

    <label class="moneda-dialog__field">
      <span>Abreviatura</span>
      <input type="text" formControlName="monAbr" maxlength="15">
      <small class="moneda-dialog__error" *ngIf="form.controls['monAbr'].touched && (form.controls['monAbr'].hasError('required') || form.controls['monAbr'].hasError('whitespace'))">Campo Abreviatura obligatorio.</small>
    </label>

    <p *ngIf="errorMessage" class="moneda-dialog__error">{{ errorMessage }}</p>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-stroked-button type="button" (click)="cerrar()" [disabled]="isSaving">Cancelar</button>
    <button mat-flat-button color="primary" type="button" (click)="guardar()" [disabled]="isSaving">
      {{ isSaving ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</section>

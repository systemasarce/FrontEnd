<h2 mat-dialog-title>Cancelar pedido</h2>

<div mat-dialog-content class="pedido-cancel__content">
  <p>{{ 'Se cancelará el pedido en edición. Esta acción cerrará el formulario actual.' }}</p>
</div>

<div mat-dialog-actions align="end" class="pedido-cancel__actions">
  <button mat-stroked-button type="button" (click)="cerrar()">
    Volver
  </button>

  <button mat-raised-button color="warn" type="button" (click)="confirmar()">
    Confirmar cancelación
  </button>
</div>

<h2 mat-dialog-title>{{ data.titulo }}</h2>

<div mat-dialog-content class="confirmacion-dialog__content">
  <p>{{ data.mensaje }}</p>
</div>

<div mat-dialog-actions align="end" class="confirmacion-dialog__actions">
  <button mat-stroked-button type="button" (click)="cancelar()">
    {{ data.textoCancelar || 'Volver' }}
  </button>

  <button
    mat-raised-button
    [color]="data.tipo === 'peligro' ? 'warn' : 'primary'"
    type="button"
    (click)="confirmar()">
    {{ data.textoConfirmar }}
  </button>
</div>
